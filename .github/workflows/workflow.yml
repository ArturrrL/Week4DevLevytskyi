name: Basic Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - develop

jobs:
  # Завдання 1
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: echo "Hello, GitHub Actions!"

  # Завдання 2
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest with Coverage
        env:
          PYTHONPATH: .
        run: pytest --cov=myapp --cov-fail-under=70 --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Завдання 3
  build:
    needs: test 
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update README with Badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BADGE="[![CI/CD Pipeline](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml/badge.svg)](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml)"
          
          
          touch README.md
          
          
          if ! grep -qF "$BADGE" README.md; then
            echo -e "$BADGE\n\n$(cat README.md)" > README.md
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Actions"
            git add README.md
            git commit -m "docs: auto-add build status badge"
            git push
          else
            echo "Badge already exists. Skipping."
          fi